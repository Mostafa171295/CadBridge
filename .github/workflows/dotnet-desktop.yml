name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to create, for example v8.2 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write   # needed to create a Release

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: CadBridge.sln
      Configuration: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v2

      # SolidWorks is not installed on GitHub's machines, so this builds WITHOUT SolidWorks support
      # (the SolidWorks tab is still part of the program, it just cannot connect).
      - name: Restore and build
        run: msbuild $env:Solution_Name /restore /p:Configuration=$env:Configuration

      # The .exe needs the DLLs and the Scripts folder next to it, so the whole folder is zipped.
      - name: Zip the program
        run: Compress-Archive -Path "CadBridge/bin/$env:Configuration/net48/*" -DestinationPath CadBridge.zip

      - name: Upload (Actions page)
        uses: actions/upload-artifact@v4
        with:
          name: CadBridge-no-solidworks
          path: CadBridge.zip

      # Creates a DRAFT release with the zip attached. Open Releases and press "Publish release".
      # Runs when you start the workflow by hand with a version, or when a tag that starts with v is pushed.
      - name: Create draft Release
        if: ${{ github.event.inputs.version != '' || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: CadBridge.zip
          generate_release_notes: true
